name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run on main with no code change. Catches the two things that rotted
  # silently in July/August 2026 while nothing was being merged: date-dependent
  # tests (fixtures aged past a TTL) and new npm advisories against an unchanged
  # lockfile. A failing scheduled run emails the repo owner by default.
  schedule:
    - cron: '0 16 * * 1' # Mondays 09:00 America/Los_Angeles (16:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # `check` is the required status on main (branch protection). Keep it the
  # single gate: everything that must block a merge lives here.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The dashboard bundle. Typecheck does not exercise Vite (asset imports,
      # CSS, chunking) — a broken build was reaching main unnoticed.
      - name: Build dashboard bundle
        run: npm run build:web
      - name: Audit root dependencies
        run: npm audit --audit-level=high
      # Inside `check` — the ONE required status on main — so a new menubar
      # advisory actually blocks merges. As a separate job this was a "hard gate"
      # in name only: branch protection requires just the `check` context, so a
      # red sibling job never stopped a merge. The electron / electron-builder
      # majors landed; a new advisory here is a regression to fix, not noise.
      # --package-lock-only: audit the lockfile without running menubar's
      # postinstall (icon generation needs macOS iconutil).
      - name: Audit menubar dependencies
        working-directory: menubar
        run: npm audit --audit-level=high --package-lock-only
  # Browser Playwright specs (hermetic: Vite dev server with a dead-daemon
  # proxy; every API call is fulfilled by page.route — see playwright.config.ts).
  # Separate and NOT required on main: `check` stays the single merge gate.
  # playwright.config.ts keys off CI to skip the menubar (Electron) spec — it
  # needs menubar/node_modules (postinstall icon generation wants macOS
  # iconutil) and a display, so it stays local-only — and to drive Playwright's
  # bundled Chromium instead of the branded Chrome dev machines have.
  e2e-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Cache the Chromium download keyed on the lockfile's Playwright version —
      # browsers live outside node_modules (~/.cache/ms-playwright), so npm's
      # cache never covers them and every run re-downloaded ~170MB.
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # Still runs on a cache hit: the browser download no-ops, but --with-deps
      # installs the OS packages the runner image lacks.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser e2e specs
        run: npm run test:e2e
      # Traces (playwright.config.ts: retain-on-failure) outlive the runner so a
      # red run can be debugged locally with `npx playwright show-trace`.
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: /tmp/boardroom-playwright-results
          retention-days: 7
